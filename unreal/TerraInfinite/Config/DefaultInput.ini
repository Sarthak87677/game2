; Terra Infinite - input. Enhanced Input is the only input path.
; Input Action / Mapping Context assets are binary .uasset files that cannot be authored here, so the actions and
; their default key bindings are declared in this file and instantiated at run time by UTerraInputConfig
; (Source/TerraInfinite/Private/Core/TerraInput.cpp). Designers can later replace them with real assets by
; assigning MappingContextOverride in the same settings section.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=True
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bCaptureMouseOnLaunch=True
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableLegacyInputScales=False
ConsoleKeys=Tilde

[/Script/TerraInfinite.TerraInputSettings]
; Actions (name, value type). ValueType: Boolean | Axis1D | Axis2D
+Actions=(Name="Move",ValueType=Axis2D,Description="Walk / drive: X = strafe or steer, Y = forward or throttle")
+Actions=(Name="Look",ValueType=Axis2D,Description="Camera yaw/pitch from mouse deltas")
+Actions=(Name="LookGamepad",ValueType=Axis2D,Description="Camera yaw/pitch from the right stick (per-second rate)")
+Actions=(Name="Jump",ValueType=Boolean,Description="Jump; in parkour zones gets assist")
+Actions=(Name="Run",ValueType=Boolean,Description="Hold to run")
+Actions=(Name="Interact",ValueType=Boolean,Description="Use the nearest interaction (doors, ticket counters, board)")
+Actions=(Name="EnterExitVehicle",ValueType=Boolean,Description="Enter the nearest vehicle / leave the current one")
+Actions=(Name="CameraCycle",ValueType=Boolean,Description="Cycle first-person / third-person / far chase")
+Actions=(Name="Horn",ValueType=Boolean,Description="Vehicle horn (hold)")
+Actions=(Name="Lights",ValueType=Boolean,Description="Vehicle headlights off / low / high")
+Actions=(Name="IndicatorLeft",ValueType=Boolean,Description="Left indicator toggle")
+Actions=(Name="IndicatorRight",ValueType=Boolean,Description="Right indicator toggle")
+Actions=(Name="Hazards",ValueType=Boolean,Description="Hazard lights toggle")
+Actions=(Name="Wipers",ValueType=Boolean,Description="Wipers off / intermittent / on")
+Actions=(Name="Handbrake",ValueType=Boolean,Description="Vehicle handbrake (hold)")
+Actions=(Name="ResetVehicle",ValueType=Boolean,Description="Un-stick / flip the vehicle back onto its wheels")
+Actions=(Name="Diagnostics",ValueType=Boolean,Description="Toggle the performance diagnostics overlay")
+Actions=(Name="Pause",ValueType=Boolean,Description="Pause menu")

; Bindings (action, key, optional modifiers). Axis: which axis of the action a 1-D key feeds (X or Y); Negate flips it.
; Keyboard + mouse
+Bindings=(Action="Move",Key=W,Axis=Y)
+Bindings=(Action="Move",Key=S,Axis=Y,bNegate=True)
+Bindings=(Action="Move",Key=D,Axis=X)
+Bindings=(Action="Move",Key=A,Axis=X,bNegate=True)
+Bindings=(Action="Move",Key=Up,Axis=Y)
+Bindings=(Action="Move",Key=Down,Axis=Y,bNegate=True)
+Bindings=(Action="Move",Key=Right,Axis=X)
+Bindings=(Action="Move",Key=Left,Axis=X,bNegate=True)
+Bindings=(Action="Look",Key=Mouse2D,bNegateY=True)
+Bindings=(Action="Jump",Key=SpaceBar)
+Bindings=(Action="Run",Key=LeftShift)
+Bindings=(Action="Interact",Key=E)
+Bindings=(Action="EnterExitVehicle",Key=F)
+Bindings=(Action="CameraCycle",Key=V)
+Bindings=(Action="Horn",Key=H)
+Bindings=(Action="Lights",Key=L)
+Bindings=(Action="IndicatorLeft",Key=Q)
+Bindings=(Action="IndicatorRight",Key=R)
+Bindings=(Action="Hazards",Key=Z)
+Bindings=(Action="Wipers",Key=X)
+Bindings=(Action="Handbrake",Key=SpaceBar)
+Bindings=(Action="ResetVehicle",Key=Backspace)
+Bindings=(Action="Diagnostics",Key=F3)
+Bindings=(Action="Pause",Key=Escape)
; Gamepad
+Bindings=(Action="Move",Key=Gamepad_Left2D)
+Bindings=(Action="LookGamepad",Key=Gamepad_Right2D)
+Bindings=(Action="Jump",Key=Gamepad_FaceButton_Bottom)
+Bindings=(Action="Run",Key=Gamepad_LeftThumbstick)
+Bindings=(Action="Interact",Key=Gamepad_FaceButton_Left)
+Bindings=(Action="EnterExitVehicle",Key=Gamepad_FaceButton_Top)
+Bindings=(Action="CameraCycle",Key=Gamepad_RightThumbstick)
+Bindings=(Action="Horn",Key=Gamepad_LeftShoulder)
+Bindings=(Action="Lights",Key=Gamepad_DPad_Up)
+Bindings=(Action="IndicatorLeft",Key=Gamepad_DPad_Left)
+Bindings=(Action="IndicatorRight",Key=Gamepad_DPad_Right)
+Bindings=(Action="Hazards",Key=Gamepad_DPad_Down)
+Bindings=(Action="Handbrake",Key=Gamepad_FaceButton_Right)
+Bindings=(Action="ResetVehicle",Key=Gamepad_Special_Left)
+Bindings=(Action="Pause",Key=Gamepad_Special_Right)

; Look sensitivity (degrees per mouse unit / per second at full stick)
MouseLookScale=0.12
GamepadLookDegreesPerSecond=140.0
; Optional: a hand-authored UInputMappingContext asset overrides the generated one when set.
MappingContextOverride=None
