; Terra Infinite - Unreal Engine 5.4+ project settings.
; STATUS: written in a sandbox without Unreal Engine or a GPU and never loaded by an editor yet (docs/UNREAL.md).
; Real credentials never go here: see Config/Secrets.ini.example (Config/Secrets.ini is git-ignored).

[/Script/EngineSettings.GameMapsSettings]
; L_Benchmark must be created in the editor (Cesium World Terrain + CesiumGeoreference + TerraGameMode); see
; docs/UNREAL.md "Benchmark map". Binary .umap assets cannot be authored in this repository.
GameDefaultMap=/Game/Maps/L_Benchmark.L_Benchmark
EditorStartupMap=/Game/Maps/L_Benchmark.L_Benchmark
GlobalDefaultGameMode=/Script/TerraInfinite.TerraGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
; Terra's C++ classes replace the engine defaults (kept here so the project works without Blueprint subclasses).
GameViewportClientClassName=/Script/Engine.GameViewportClient
NearClipPlane=10.0

[/Script/Engine.RendererSettings]
; --- Nanite / Lumen / Virtual Shadow Maps / TSR -------------------------------------------------------------
r.Nanite.ProjectEnabled=True
r.DynamicGlobalIlluminationMethod=1            ; 1 = Lumen
r.ReflectionMethod=1                           ; 1 = Lumen reflections
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=False               ; software Lumen by default; enable HWRT per machine in Secrets/Scalability
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4                         ; 4 = Temporal Super Resolution
r.TemporalAA.Upsampling=True
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.2
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False        ; Lumen provides GI/AO
r.SkinCache.CompileShaders=True
r.RayTracing=False
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VirtualTextures=True
r.VT.EnableAutoImport=True
r.Substrate=False
r.Water.EnableUnderwaterPostProcess=1
r.SkyAtmosphere.AerialPerspective.LUT.Width=64
r.Mobile.EnableNoPrecomputedLightingCSMShader=1
r.AllowStaticLighting=False                    ; fully dynamic world (streamed planet, no lightmaps)
r.ForwardShading=False
r.MSAACount=4
r.CustomDepth=3
r.GBufferFormat=1
r.ReflectionCaptureResolution=128
r.DynamicResolution.ScreenPercentage.Min=50    ; consumed by the dynamic-resolution driver below
DefaultFeatureAntiAliasing=AAM_TSR
bDefaultFeatureAutoExposure=True

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True
s.EventDrivenLoaderEnabled=True
s.WarnIfTimeLimitExceeded=False
s.LevelStreamingComponentsRegistrationGranularity=10
s.LevelStreamingActorsUpdateTimeLimit=5.0
s.PriorityLevelStreamingActorsUpdateExtraTime=5.0
s.UnregisterComponentsTimeLimit=1.0
s.PriorityAsyncLoadingExtraTime=15.0
s.LevelStreamingComponentsUnregistrationGranularity=5
s.FlushStreamingOnExit=True

[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInGame=4000000
gc.CreateGCClusters=True
gc.ActorClusteringEnabled=True
gc.BlueprintClusteringEnabled=True
gc.TimeBetweenPurgingPendingKillObjects=120

[/Script/Engine.WorldPartitionSettings]
; World Partition is enabled per-level (Window > World Settings > Enable Streaming); L_Benchmark uses a 12 800 cm
; runtime grid with HLOD layers (HLOD_Instancing for buildings, HLOD_MergedMesh for far terrain props).
; The gameplay-side cell streaming (procedural content, interiors, traffic spawners) is UGeoStreamingSubsystem.

[SystemSettings]
; World Partition runtime
wp.Runtime.EnableServerStreaming=0
wp.Runtime.HLOD=1
wp.Runtime.UpdateStreaming.EnableOptimization=1
wp.Runtime.BlockOnSlowStreaming=0
; Texture and mesh streaming budgets (MB); the quality governor lowers these on Performance mode
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseAllMips=0
r.Streaming.MaxNumTexturesToStreamPerFrame=12
r.Nanite.MaxPixelsPerEdge=1
r.Nanite.ViewMeshLODBias.Enable=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
; Dynamic resolution + TSR defaults (frame-budget driven; see DefaultScalability.ini and UPerfDiagnosticsSubsystem)
r.DynamicRes.OperationMode=2                   ; 2 = enabled regardless of the game user setting
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=100
r.DynamicRes.FrameTimeBudget=16.6              ; 60 FPS target; Performance Mode keeps it, Ultra relaxes to 33.3
r.DynamicRes.TargetedGPUHeadRoomPercentage=10
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1
; Cesium tile streaming
cesium.tiles.maximumSimultaneousTileLoads=20
; Terra custom variables (read by the C++ subsystems, defaults here)
terra.Streaming.CellSizeM=256
terra.Streaming.RadiusCells=6
terra.Streaming.MaxLoadsPerFrame=2
terra.Streaming.BudgetMs=2.0
terra.Traffic.Density=1.0
terra.Crowd.Density=1.0
terra.Sim.FullRadiusM=300
terra.Perf.TargetFps=60

