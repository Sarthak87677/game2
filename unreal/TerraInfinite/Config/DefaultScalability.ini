; Terra Infinite - scalability. Written without an Unreal install; untested on real hardware (docs/UNREAL.md).
;
; Quality levels: 0 = Low, 1 = Medium, 2 = High, 3 = Ultra (engine "Epic"). "Performance Mode" (60 FPS) is a preset
; applied by UTerraScalabilityLibrary::ApplyPreset that combines these groups with the degradation ladder below.
;
; Degradation order (what UPerfDiagnosticsSubsystem's quality governor drops FIRST when under budget, and restores
; LAST): distant shadows -> reflections -> foliage density -> traffic/crowd density -> draw distance.
; Nearby building quality (Nanite, textures) and the player/vehicle quality (skin cache, AA) are never degraded by
; the governor; only the user can lower them by picking a lower quality level.

[ScalabilitySettings]
PerfIndexValues_ResolutionQuality="50 71 84 100 100"
PerfIndexValues_ViewDistanceQuality="18 42 105 250 250"
PerfIndexValues_AntiAliasingQuality="18 42 105 250 250"
PerfIndexValues_ShadowQuality="18 42 105 250 250"
PerfIndexValues_GlobalIlluminationQuality="18 42 105 250 250"
PerfIndexValues_ReflectionQuality="18 42 105 250 250"
PerfIndexValues_PostProcessQuality="18 42 105 250 250"
PerfIndexValues_TextureQuality="18 42 105 250 250"
PerfIndexValues_EffectsQuality="18 42 105 250 250"
PerfIndexValues_FoliageQuality="18 42 105 250 250"
PerfIndexValues_ShadingQuality="18 42 105 250 250"
PerfIndexValues_LandscapeQuality="18 42 105 250 250"

